<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>English Diner & Adventure - 英文學習小遊戲</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; }
        #game-container { width: 600px; background: white; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #4A90E2; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .score-board { font-size: 1.2rem; font-weight: bold; }
        .npc-area { padding: 30px 20px; background: #eef6ff; text-align: center; border-bottom: 2px solid #e0e0e0; }
        .npc-avatar { font-size: 60px; margin-bottom: 10px; }
        .speech-bubble { background: white; padding: 15px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.05); font-size: 1.1rem; color: #333; }
        .menu-area { padding: 20px; }
        .menu-title { font-size: 1rem; color: #666; margin-bottom: 10px; }
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .option-btn { background: #f8f9fa; border: 2px solid #dee2e6; border-radius: 10px; padding: 12px; font-size: 1rem; cursor: pointer; transition: all 0.2s; text-align: left; }
        .option-btn:hover { background: #e9ecef; border-color: #4A90E2; }
        .feedback { text-align: center; padding: 10px; font-weight: bold; height: 24px; margin-top: 10px; }
        .success { color: #2e7d32; }
        .error { color: #c62828; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 頂部資訊 -->
    <div class="header">
        <div id="theme-title">🏪 English Diner</div>
        <div class="score-board">Score: <span id="score">0</span></div>
    </div>

    <!-- NPC 顧客區 -->
    <div class="npc-area">
        <div id="npc-avatar" class="npc-avatar">🧔</div>
        <div id="speech-bubble" class="speech-bubble">Loading...</div>
    </div>

    <!-- 操作菜單區 -->
    <div class="menu-area">
        <div class="menu-title">推薦餐點給顧客 (Recommend to Customer)：</div>
        <div id="options-grid" class="options-grid"></div>
        <div id="feedback" class="feedback"></div>
    </div>
</div>

<script>
// ==========================================
// 1. 未來可擴充的主題資料庫 (Themes Database)
// ==========================================
const GAME_DATABASE = {
    // 【主題一：餐廳】(現階段進行)
    restaurant: {
        title: "🏪 English Diner",
        menu: [
            { id: "ice_coffee", name: "Iced Coffee", tags: ["cold", "drink"] },
            { id: "hot_coffee", name: "Hot Coffee", tags: ["hot", "drink"] },
            { id: "ice_tea",    name: "Iced Tea",    tags: ["cold", "drink"] },
            { id: "hot_tea",    name: "Hot Tea",    tags: ["hot", "drink"] },
            { id: "hamburger",  name: "Hamburger",  tags: ["meal"] }
        ],
        customers: [
            {
                text: "It is so hot today! I want some cold drink.",
                requiredTags: ["cold", "drink"],
                successText: "Yummy! This iced drink is so refreshing! (+2)",
                failText: "Oh no... It is too hot for this! (-1)"
            },
            {
                text: "I am freezing! Can I have a hot drink?",
                requiredTags: ["hot", "drink"],
                successText: "Thank you! This keeps me warm! (+2)",
                failText: "Brrr! I asked for a HOT drink! (-1)"
            },
            {
                text: "I am so hungry! I want a big meal.",
                requiredTags: ["meal"],
                successText: "Delicious! Exactly what I needed! (+2)",
                failText: "I'm hungry, drinks won't fill me up! (-1)"
            }
        ]
    },

    // 【主題二：動物園】(預留框架，未來解鎖)
    zoo: {
        title: "🦁 English Zoo",
        menu: [],
        customers: []
    }
};

// ==========================================
// 2. 核心遊戲引擎 (Game Engine)
// ==========================================
class GameEngine {
    constructor() {
        this.score = 0;
        this.currentTheme = "restaurant"; // 預設執行餐廳主題
        this.currentCustomer = null;
    }

    init() {
        this.loadTheme(this.currentTheme);
    }

    loadTheme(themeKey) {
        const theme = GAME_DATABASE[themeKey];
        document.getElementById("theme-title").innerText = theme.title;
        this.renderMenu(theme.menu);
        this.nextCustomer();
    }

    renderMenu(menuItems) {
        const grid = document.getElementById("options-grid");
        grid.innerHTML = "";
        menuItems.forEach(item => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = item.name;
            btn.onclick = () => this.handleSelection(item);
            grid.appendChild(btn);
        });
    }

    nextCustomer() {
        const theme = GAME_DATABASE[this.currentTheme];
        const randomIndex = Math.floor(Math.random() * theme.customers.length);
        this.currentCustomer = theme.customers[randomIndex];
        
        document.getElementById("speech-bubble").innerText = `"${this.currentCustomer.text}"`;
        document.getElementById("feedback").innerText = "";
    }

    handleSelection(selectedItem) {
        // 比對 selectedItem 的 tags 是否包含顧客要求的全部 requiredTags
        const isMatch = this.currentCustomer.requiredTags.every(tag => selectedItem.tags.includes(tag));
        const feedbackEl = document.getElementById("feedback");

        if (isMatch) {
            this.score += 2;
            feedbackEl.innerText = this.currentCustomer.successText;
            feedbackEl.className = "feedback success";
        } else {
            this.score -= 1;
            feedbackEl.innerText = this.currentCustomer.failText;
            feedbackEl.className = "feedback error";
        }

        document.getElementById("score").innerText = this.score;

        // 1.5 秒後換下一位顧客
        setTimeout(() => this.nextCustomer(), 1800);
    }
}

// 啟動遊戲
const game = new GameEngine();
game.init();
</script>

</body>
</html>
