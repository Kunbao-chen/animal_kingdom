<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Diner - 語音口說餐廳大廚</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div id="game-container">
    <div class="header">
        <div>🏪 English Diner</div>
        <div class="header-right">
            <button class="redeem-btn" onclick="game.openRedeemModal()">🎁 Redeem</button>
            <div class="score-box">Score: <span id="score">0</span></div>
        </div>
    </div>

    <!-- 顧客對話區 -->
    <div class="npc-section">
        <div id="npc-avatar" class="npc-avatar">🧔</div>
        <div class="speech-bubble">
            <span id="speech-text">Loading...</span>
            <button class="audio-btn" onclick="game.speakCustomerText()">🔊</button>
        </div>
    </div>

    <div class="interactive-section">
        <!-- 步驟 1: 選擇餐點 -->
        <div id="step-menu">
            <div class="section-title">Step 1: Choose a menu item for customer</div>
            <div id="options-grid" class="options-grid"></div>
        </div>

        <!-- 步驟 2: 口說區 -->
        <div id="step-speaking" class="speaking-area">
            <div class="section-title">Step 2: Read aloud (Listen & Speak)</div>
            <div class="target-sentence">
                <span id="target-sentence">"How about..."</span>
                <button class="audio-btn" onclick="game.speakTargetSentence()">🔊</button>
            </div>
            
            <div class="btn-group">
                <button id="mic-btn" class="mic-btn" onclick="game.startListening()">
                    🎙️ Tap & Speak Now
                </button>
                <button id="retry-btn" class="retry-btn" onclick="game.retrySpeaking()">
                    🔄 Try Again
                </button>
            </div>

            <div id="recognized-text" class="recognized-text"></div>
            <div id="attempts-left" class="attempts-left"></div>
        </div>

        <!-- 結果與回饋 -->
        <div id="feedback" class="feedback"></div>

        <div class="next-btn-container">
            <button id="next-btn" class="next-btn" onclick="game.nextCustomer()">
                Next Customer ➡️
            </button>
        </div>
    </div>
</div>

<!-- 簡化版積分兌換彈窗 -->
<div id="redeem-modal" class="modal-overlay">
    <div class="modal-content">
        <h2>🎁 Redeem Points (積分兌換)</h2>
        <p>Current Score: <strong id="modal-score">0</strong> Points</p>
        <p style="font-size: 0.9rem; color: #64748b;">Enter points to redeem with your teacher or parents:</p>
        
        <input type="number" id="redeem-input" class="redeem-input" placeholder="Enter points..." min="1">
        
        <div class="modal-btn-group">
            <button class="claim-btn" onclick="game.confirmRedeem()">Confirm Redeem ✅</button>
            <button class="close-btn" onclick="game.closeRedeemModal()">Cancel</button>
        </div>
    </div>
</div>

<!-- 關鍵：加上 type="module"，讓瀏覽器安全依序載入 -->
<script type="module" src="./js/app.js"></script>

</body>
</html>
